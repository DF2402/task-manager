<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>測試 HTML 文件</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1 { color: #333; }
        .highlight { background-color: yellow; }
    </style>
</head>
<body>
    <h1>文件預覽測試</h1>
    <p>這是一個 <span class="highlight">HTML 文件</span> 的預覽示例。</p>
    <ul>
        <li>支持 HTML 格式</li>
        <li>保留樣式</li>
        <li>可以包含中文內容</li>
    </ul>
</body>
</html>
